name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  IMAGE_NAME: alphahinex/medimageinsights

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 40960
        swap-size-mb: 1024
        overprovision-lvm: 'true'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    - name: Check
      run: |
        echo "Free space:"
        df -h

    - uses: actions/checkout@v4

    - name: Download model file and check
      run: |
        wget https://huggingface.co/lion-ai/MedImageInsights/resolve/main/2024.09.27/vision_model/medimageinsigt-v1.0.0.pt -O 2024.09.27/vision_model/medimageinsigt-v1.0.0.pt
        du -sh * 

    - name: Build image
      run: |
        docker build . --file Dockerfile --tag $IMAGE_NAME:cpu
        docker build . --file Dockerfile_gpu --tag $IMAGE_NAME:gpu

    - name: Log in to Docker Hub
      uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push image
      run: |
        docker push $IMAGE_NAME:cpu
        docker push $IMAGE_NAME:gpu
